description: 'Golden Ventures is a seed-stage venture capital firm based in Toronto, Canada, founded in
  2011 by former founders and operators who back bold, early-stage entrepreneurial teams across North
  America. The firm is sector agnostic and invests at the pre-seed, seed, and seed+ stages with typical
  initial checks of roughly $500K to $3M, having made over 100 investments including Wattpad, BenchSci,
  Float, ResQ, and Neo Financial. It was surfaced in the API Evangelist network as a portfolio company of
  Foundry Group. As a venture-capital firm rather than an API provider, it publishes no developer or API
  surface; this profile captures firm identity and domain security posture.'
